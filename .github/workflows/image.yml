name: gateway image
on:
  push:
    branches: [main]
    paths: [gateway/**, solarbench/**, pyproject.toml, .github/workflows/image.yml]
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-llm-gateway:latest,ghcr.io/${{ github.repository_owner }}/solar-llm-gateway:${{ github.sha }}
