global: {scrape_interval: 1s, evaluation_interval: 5s}
scrape_configs:
  - job_name: engine
    static_configs: [{targets: ["host.docker.internal:8000"]}]
  - job_name: triton
    metrics_path: /metrics
    static_configs: [{targets: ["host.docker.internal:8002"]}]
  - job_name: dcgm
    static_configs: [{targets: ["dcgm-exporter:9400"]}]
  - job_name: gateway
    static_configs: [{targets: ["host.docker.internal:8080"]}]
