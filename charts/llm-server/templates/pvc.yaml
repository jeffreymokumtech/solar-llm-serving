{{- if .Values.cache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-cache
  labels: {{- include "llm.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.cache.storageClass }}
  resources:
    requests:
      storage: {{ .Values.cache.size }}
{{- end }}
