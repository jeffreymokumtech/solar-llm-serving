{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels: {{- include "llm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "llm.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {port: {{ .Values.port }}}
        - {port: {{ .Values.metricsPort }}}
{{- end }}
