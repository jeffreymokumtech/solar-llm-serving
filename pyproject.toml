[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-llm-serving"
version = "0.1.0"
description = "Self-hosted LLM inference platform benchmarked on a solar O&M workload: vLLM, SGLang, TensorRT-LLM on AWS EKS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6",
  "click>=8.1",
  "matplotlib>=3.8",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
]
gateway = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "boto3>=1.34",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.scripts]
solarbench = "solarbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solarbench", "gateway"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
